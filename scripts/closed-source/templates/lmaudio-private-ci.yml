name: lmaudio private CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish after the full matrix (for example v0.2.2)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lmaudio-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux-fast:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out public examples anonymously
        run: git clone --depth 1 https://github.com/lmctl-ai/lmaudio.git public
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install lmscript
        run: npm install --global @lmctl-ai/lmctl@0.2.420
      - name: Install Linux tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Verify pins, build, and run private tests
        env:
          LMAUDIO_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify
          ./test.sh
      - name: Check and run public examples against this build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/build:$PATH"
          find public/examples -type f -name '*.lms' -print0 |
            while IFS= read -r -d '' example; do
              relative="${example#public/}"
              (cd public && lmscript --check "$relative" && lmscript "$relative")
            done

  full-matrix:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-2022, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: full ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out public examples anonymously
        run: git clone --depth 1 https://github.com/lmctl-ai/lmaudio.git public
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install lmscript
        run: npm install --global @lmctl-ai/lmctl@0.2.420
      - name: Verify pins, build, and run private tests
        env:
          LMAUDIO_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify
          ./test.sh
      - name: Check and run public examples against this build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/build:$PATH"
          find public/examples -type f -name '*.lms' -print0 |
            while IFS= read -r -d '' example; do
              relative="${example#public/}"
              (cd public && lmscript --check "$relative" && lmscript "$relative")
            done
      - name: Package the platform binary
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=".exe"
          cp "build/lmaudio$ext" "dist/lmaudio-$MATRIX_NAME$ext"
          if [ "$MATRIX_NAME" = "linux-x64" ]; then
            cp public/LICENSE-binaries dist/LICENSE
            cp public/THIRD_PARTY_NOTICES dist/THIRD_PARTY_NOTICES
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lmaudio-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [full-matrix]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out public release notices anonymously
        run: git clone --depth 1 https://github.com/lmctl-ai/lmaudio.git public
      - uses: actions/download-artifact@v4
        with:
          pattern: lmaudio-*
          path: release-artifacts
          merge-multiple: true
      - name: Select the release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$MANUAL_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Assemble files and checksums
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artifacts -type f -name 'lmaudio-*' -exec cp {} release/ \;
          for asset in lmaudio-linux-x64 lmaudio-linux-arm64 lmaudio-macos-arm64 lmaudio-macos-x64 lmaudio-windows-x64.exe; do
            test -f "release/$asset"
          done
          cp public/LICENSE-binaries release/LICENSE
          cp public/THIRD_PARTY_NOTICES release/THIRD_PARTY_NOTICES
          (cd release && sha256sum lmaudio-* > SHA256SUMS)
      # GitHub Actions does not allow the secrets context directly in an if.
      # Probe only for presence; keep the token itself scoped to the publish step.
      - name: Check whether automatic publishing is configured
        id: release_token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to the public peer when the token exists
        if: steps.release_token.outputs.available == 'true' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAG" || { echo "Set release_tag for a manual publication" >&2; exit 1; }
          gh release create "$TAG" -R lmctl-ai/lmaudio --target main --title "$TAG" --generate-notes release/*
      - name: Leave artifacts ready for the manual publisher when no token exists
        if: steps.release_token.outputs.available != 'true' || steps.release.outputs.tag == ''
        run: echo "Full matrix is green; run scripts/publish-release.sh with this workflow run ID."
