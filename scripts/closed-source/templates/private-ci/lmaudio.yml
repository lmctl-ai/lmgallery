name: lmaudio private CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: First/new public tag, for example v0.3.0
        required: false
        type: string
      publish_test:
        description: Create and delete a draft public release to verify the publishing token, without building
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lmaudio-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux-fast:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out public examples anonymously
        run: git clone --depth 1 https://github.com/lmctl-ai/lmaudio.git public
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install lmscript and Linux tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          npm install --global @lmctl-ai/lmctl@0.2.420
      - name: Build and test private source
        env:
          LMAUDIO_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify
          ./test.sh
          echo "$GITHUB_WORKSPACE/build" >> "$GITHUB_PATH"
      - name: Check and run public examples against the fresh Linux host
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -d public/examples ]; then
            find public/examples -type f -name '*.lms' -print0 |
              while IFS= read -r -d '' example; do
                relative="${example#public/}"
                (cd public && lmscript --check "$relative" && lmscript "$relative")
              done
          fi

  full-matrix:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_test != true) || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-2022, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: full ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out public examples anonymously
        run: git clone --depth 1 https://github.com/lmctl-ai/lmaudio.git public
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install lmscript
        run: npm install --global @lmctl-ai/lmctl@0.2.420
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils
      - name: Install Windows tools
        if: runner.os == 'Windows'
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then choco install -y mingw ninja; fi
          mkdir -p .ci-bin
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
          chmod +x .ci-bin/python3
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
      - name: Build and test private source
        env:
          LMAUDIO_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify
          ./test.sh
          echo "$GITHUB_WORKSPACE/build" >> "$GITHUB_PATH"
      - name: Check and run public examples against the fresh host
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -d public/examples ]; then
            find public/examples -type f -name '*.lms' -print0 |
              while IFS= read -r -d '' example; do
                relative="${example#public/}"
                (cd public && lmscript --check "$relative" && lmscript "$relative")
              done
          fi
      - name: Package the platform binary
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "build/lmaudio$ext" "dist/lmaudio-$MATRIX_NAME$ext"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-test:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify public release write permission without a build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tag="lmctl-publish-test-${GITHUB_RUN_ID}"
          cleanup() { gh release delete "$tag" -R lmctl-ai/lmaudio --yes >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gh release create "$tag" -R lmctl-ai/lmaudio --draft --target main --title "$tag" --notes "Temporary release-token permission check."
          test "$(gh release view "$tag" -R lmctl-ai/lmaudio --json isDraft --jq .isDraft)" = true
          gh release delete "$tag" -R lmctl-ai/lmaudio --yes
          trap - EXIT
          if gh release view "$tag" -R lmctl-ai/lmaudio >/dev/null 2>&1; then
            echo "publish-test draft release still exists" >&2
            exit 1
          fi

  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_test != true) || startsWith(github.ref, 'refs/tags/v')
    needs: [full-matrix]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true
      - name: Select the first/new release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$MANUAL_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          test -n "$tag" || { echo "Set release_tag for workflow_dispatch" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish the first/new release to the public peer
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/release-to-public.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/release-artifacts"
